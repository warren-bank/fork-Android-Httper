buildscript {
  repositories {
    google()
    jcenter()
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:8.7.2'         // https://mvnrepository.com/artifact/com.android.tools.build/gradle?repo=google
                                                             // https://developer.android.com/build/releases/gradle-plugin#updating-gradle
                                                             // https://developer.android.com/build/releases/gradle-plugin#api-level-support
    classpath 'org.greenrobot:greendao-gradle-plugin:3.3.1'  // https://mvnrepository.com/artifact/org.greenrobot/greendao-gradle-plugin
                                                             // https://github.com/greenrobot/greenDAO/issues/1110#issuecomment-1609217601
                                                             //   Gradle plugin 8.x => requires greenDAO plugin 3.3.1
                                                             // https://github.com/greenrobot/greenDAO/issues/1125
                                                             //   Gradle plugin 9.x => is incompatible
  }
}

allprojects {
  repositories {
    google()
    jcenter()
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}
